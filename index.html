<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>this is for u, from nesa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050003; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace, sans-serif; 
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Teks utama sekarang berada di atas dengan gaya estetik */
        .text-top-main {
            position: absolute;
            top: 12%;
            color: #ffb7d5;
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(255, 20, 147, 0.6);
            z-index: 10;
            text-align: center;
            pointer-events: none;
            text-transform: lowercase; 
        }
    </style>
</head>
<body>

    <!-- Teks atas baru, pov lama sudah dihapus -->
    <div class="text-top-main">this is for u, from nesa 🎧✨</div>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const bigHeartParticles = [];
        const smallHeartParticles = [];
        
        // 1. SILUET HATI BESAR
        const totalBig = 1400; 
        for (let i = 0; i < totalBig; i++) {
            const t = Math.random() * Math.PI * 2;
            const phi = (Math.random() - 0.5) * 0.25;
            
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = phi * 10;

            const noise = 1 + (Math.random() - 0.5) * 0.07; 

            bigHeartParticles.push({
                x: x * noise * 1.5,
                y: y * noise * 1.5,
                z: z,
                color: Math.random() > 0.4 ? '#ff2a70' : '#ffccd5',
                size: Math.random() * 1.4 + 0.3,
                randomPhase: Math.random() * 15
            });
        }

        // 2. HATI KRISTAL DI TENGAH
        const totalSmall = 750;
        for (let i = 0; i < totalSmall; i++) {
            const t = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;

            const baseX = 16 * Math.pow(Math.sin(t), 3);
            const baseY = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            const x = baseX * Math.sin(phi) * 0.42;
            const y = baseY * Math.sin(phi) * 0.42;
            const z = 15 * Math.cos(phi) * 0.42;

            const colors = ['#ff0055', '#ff558b', '#ffccd5', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            smallHeartParticles.push({ x, y, z, color, size: Math.random() * 1.4 + 0.5 });
        }

        // 3. AMBIENT DUST
        const bgParticles = [];
        for (let i = 0; i < 90; i++) {
            bgParticles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 1.2,
                speed: Math.random() * 0.3 + 0.1 
            });
        }

        let angleY = 0;

        function draw() {
            ctx.fillStyle = 'rgba(5, 0, 3, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const time = Date.now() * 0.0015;

            ctx.fillStyle = 'rgba(255, 204, 213, 0.25)';
            for (let p of bgParticles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speed;
                if (p.y < 0) p.y = canvas.height;
            }

            angleY += 0.01; 
            const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + 10; // Sedikit diturunkan agar posisi hati seimbang dengan teks atas

            const allProjected = [];

            // Proyeksi Hati Luar
            for (let p of bigHeartParticles) {
                let x1 = p.x * cosY - p.z * sinY;
                let z1 = p.x * sinY + p.z * cosY;

                const perspective = 320;
                const scale = perspective / (perspective + z1);
                const twinkle = 0.3 + Math.sin(time + p.randomPhase) * 0.7;

                allProjected.push({
                    x: centerX + x1 * scale * 11.5,
                    y: centerY - p.y * scale * 11.5,
                    size: p.size * scale,
                    color: p.color,
                    alpha: twinkle,
                    z: z1
                });
            }

            // Proyeksi Hati Dalam
            const cosY_small = Math.cos(-angleY * 1.3), sinY_small = Math.sin(-angleY * 1.3);
            const beatFactor = 1 + Math.sin(time * 2.5) * 0.04; 

            for (let p of smallHeartParticles) {
                let x1 = (p.x * beatFactor) * cosY_small - p.z * sinY_small;
                let z1 = (p.x * beatFactor) * sinY_small + p.z * cosY_small;

                const perspective = 320;
                const scale = perspective / (perspective + z1);

                allProjected.push({
                    x: centerX + x1 * scale * 11.5,
                    y: centerY - (p.y * beatFactor) * scale * 11.5,
                    size: p.size * scale,
                    color: p.color,
                    alpha: 0.9,
                    z: z1
                });
            }

            allProjected.sort((a, b) => b.z - a.z);

            for (let p of allProjected) {
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = p.alpha * 8; 
                ctx.shadowColor = p.color;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
